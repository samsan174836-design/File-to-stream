<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#070812">
    <title>{{ video_title }} · Karva Bhaiya</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #f5effb;
            background: #17121d;
        }
        * { box-sizing: border-box; }
        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            background: radial-gradient(ellipse at 50% -20%, #49385a 0, #211a29 38%, #17121d 78%);
        }
        a { color: inherit; }
        button, input { font: inherit; }
        .page { width: min(100% - 36px, 1040px); margin: 0 auto; padding: 32px 0 56px; }
        .back-link { display: inline-block; margin-bottom: 22px; color: #d7c5e9; font-size: 14px; text-decoration: none; }
        .back-link:hover { color: #fff; }
        h1 { margin: 0 0 22px; font-size: clamp(21px, 4vw, 32px); line-height: 1.25; overflow-wrap: anywhere; }
        .player-shell {
            overflow: hidden;
            border: 1px solid rgba(224, 205, 242, .2);
            border-radius: 18px;
            background: #0b090e;
            box-shadow: 0 24px 70px rgba(0, 0, 0, .42);
        }
        .video-frame { position: relative; width: 100%; min-height: 200px; aspect-ratio: 16 / 9; background: #08070a; }
        #youtube-player { position: absolute; inset: 0; width: 100%; height: 100%; }
        .player-message {
            position: absolute;
            inset: 0;
            z-index: 1;
            display: grid;
            place-content: center;
            gap: 12px;
            padding: 24px;
            color: #eee5f7;
            background: rgba(11, 9, 14, .96);
            text-align: center;
        }
        .player-message[hidden] { display: none; }
        .player-message p { max-width: 540px; margin: 0 auto; color: #c5b8d2; line-height: 1.6; }
        .shortcuts { margin: 3px 0 0; color: #a99bb6; font-size: 12px; line-height: 1.6; }
        .external-link {
            display: inline-flex;
            min-height: 40px;
            align-items: center;
            margin-top: 18px;
            padding: 0 14px;
            border: 1px solid rgba(224, 205, 242, .24);
            border-radius: 10px;
            color: #e8d9f6;
            background: rgba(240, 231, 248, .08);
            text-decoration: none;
        }
        .external-link:hover { background: rgba(174, 145, 209, .2); }
        @media (max-width: 520px) {
            .page { width: min(100% - 24px, 1040px); padding-top: 20px; }
            .player-shell { border-radius: 12px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; }
        }
    </style>
    <link rel="stylesheet" href="/static/aurora.css?v=4">
</head>
<body>
    <main class="page">
        <a class="back-link" href="/home#study">← Back to YouTube search</a>
        <h1>{{ video_title }}</h1>
        <section class="player-shell" aria-label="Video player">
            <div class="video-frame">
                <video id="youtube-player" controls playsinline preload="metadata"></video>
                <div class="player-message" id="player-message" role="status" aria-live="polite">
                    <p id="message-copy">Loading video stream…</p>
                    <a class="external-link" id="fallback-link" href="https://www.yout-ube.com/watch?v={{ video_id }}" target="_blank" rel="noopener noreferrer" hidden>Open on YouTube</a>
                </div>
            </div>
        </section>
        <p class="shortcuts">Shortcuts (while this page has focus): <strong>Space/K</strong> play or pause · <strong>←/→</strong> seek 10s · <strong>↑/↓</strong> volume · <strong>M</strong> mute · <strong>S</strong> speed · <strong>F</strong> fullscreen.</p>
        <a class="external-link" href="https://www.yout-ube.com/watch?v={{ video_id }}" target="_blank" rel="noopener noreferrer">Open video on YouTube</a>
    </main>
    <script>
        const videoId = {{ video_id | tojson }};
        const playerMessage = document.getElementById("player-message");
        const messageCopy = document.getElementById("message-copy");
        const fallbackLink = document.getElementById("fallback-link");
        const player = document.getElementById("youtube-player");
        const playbackSpeeds = [1, 1.25, 1.5, 1.75, 2];
        let currentSpeedIndex = 0;
        let hls;

        function showMessage(message, showFallback = false) {
            messageCopy.textContent = message;
            fallbackLink.hidden = !showFallback;
            playerMessage.hidden = false;
        }

        function togglePlayback() {
            if (player.paused) {
                player.play().catch(() => showMessage("The video could not be played. Try opening it on YouTube.", true));
            } else {
                player.pause();
            }
        }

        function seekBy(seconds) {
            if (!Number.isFinite(player.duration)) return;
            player.currentTime = Math.max(0, Math.min(player.duration, player.currentTime + seconds));
        }

        function cycleSpeed() {
            currentSpeedIndex = (currentSpeedIndex + 1) % playbackSpeeds.length;
            player.playbackRate = playbackSpeeds[currentSpeedIndex];
        }

        player.addEventListener("playing", () => { playerMessage.hidden = true; });
        player.addEventListener("loadedmetadata", () => { playerMessage.hidden = true; });
        player.addEventListener("error", () => {
            showMessage("The video stream could not be loaded. You can still open it directly on YouTube.", true);
        });

        function startNativePlayback() {
            if (!player.canPlayType("application/vnd.apple.mpegurl")) {
                showMessage("HLS playback is unavailable in this browser. You can still open the video on YouTube.", true);
                return;
            }
            player.src = `/api/youtube/stream/${encodeURIComponent(videoId)}.m3u8`;
            player.load();
        }

        function startPlayback() {
            if (window.Hls && Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(`/api/youtube/stream/${encodeURIComponent(videoId)}.m3u8`);
                hls.attachMedia(player);
                hls.on(Hls.Events.MANIFEST_PARSED, () => { playerMessage.hidden = true; });
                hls.on(Hls.Events.ERROR, (_event, data) => {
                    if (data.fatal) {
                        hls.destroy();
                        showMessage("The video stream could not be loaded. You can still open it directly on YouTube.", true);
                    }
                });
            } else if (player.canPlayType("application/vnd.apple.mpegurl")) {
                startNativePlayback();
            } else {
                showMessage("This browser does not support HLS video playback. Try a browser with HLS support or open the video on YouTube.", true);
            }
        }

        document.addEventListener("keydown", (event) => {
            const target = event.target;
            if (target instanceof HTMLInputElement || target instanceof HTMLTextAreaElement
                || target instanceof HTMLSelectElement || target.isContentEditable) return;
            if (event.key === " " && target instanceof Element && target.closest("button, a")) return;
            if (event.ctrlKey || event.metaKey || event.altKey) return;
            const key = event.key.toLowerCase();
            if (![" ", "k", "arrowleft", "arrowright", "arrowup", "arrowdown", "m", "s", "f"].includes(key)) return;
            if (event.repeat) return;
            event.preventDefault();
            if (key === " " || key === "k") togglePlayback();
            else if (key === "arrowleft") seekBy(-10);
            else if (key === "arrowright") seekBy(10);
            else if (key === "arrowup") player.volume = Math.min(1, player.volume + 0.05);
            else if (key === "arrowdown") player.volume = Math.max(0, player.volume - 0.05);
            else if (key === "m") {
                player.muted = !player.muted;
            } else if (key === "s") cycleSpeed();
            else if (key === "f") {
                const frame = document.querySelector(".video-frame");
                if (document.fullscreenElement) void document.exitFullscreen();
                else if (frame.requestFullscreen) void frame.requestFullscreen();
            }
        });

        const hlsScript = document.createElement("script");
        hlsScript.src = "https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js";
        hlsScript.onload = startPlayback;
        hlsScript.onerror = startNativePlayback;
        document.head.append(hlsScript);
    </script>
    <script src="/static/aurora.js?v=2" defer></script>
</body>
</html>
