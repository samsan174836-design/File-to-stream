<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#070812">
    <title>{{ video_title }} · Karva Bhaiya</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #f5effb;
            background: #17121d;
        }
        * { box-sizing: border-box; }
        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            background: radial-gradient(ellipse at 50% -20%, #49385a 0, #211a29 38%, #17121d 78%);
        }
        a { color: inherit; }
        button, input { font: inherit; }
        .page { width: min(100% - 36px, 1040px); margin: 0 auto; padding: 32px 0 56px; }
        .back-link { display: inline-block; margin-bottom: 22px; color: #d7c5e9; font-size: 14px; text-decoration: none; }
        .back-link:hover { color: #fff; }
        h1 { margin: 0 0 22px; font-size: clamp(21px, 4vw, 32px); line-height: 1.25; overflow-wrap: anywhere; }
        .player-shell {
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: 18px;
            background: #020307;
            box-shadow: 0 24px 70px rgba(0, 0, 0, .42);
        }
        .video-frame {
            position: relative;
            width: 100%;
            min-height: 200px;
            aspect-ratio: 16 / 9;
            background: #020307;
        }
        #youtube-player {
            position: absolute;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            background: #020307;
            object-fit: contain;
        }
        .player-controls {
            position: absolute;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 2;
            display: grid;
            gap: 8px;
            padding: 38px 16px 12px;
            background: linear-gradient(transparent, rgba(0, 0, 0, .94));
            opacity: 1;
            transition: opacity .2s ease;
        }
        .video-frame.controls-hidden .player-controls { opacity: 0; pointer-events: none; }
        .progress-bar { width: 100%; height: 12px; margin: 0; accent-color: #aa91f5; cursor: pointer; }
        .control-row { display: flex; min-height: 32px; align-items: center; gap: 9px; }
        .control-btn {
            display: grid;
            width: 32px;
            height: 32px;
            flex: 0 0 auto;
            place-items: center;
            padding: 0;
            border: 0;
            border-radius: 7px;
            color: #fff;
            background: transparent;
            cursor: pointer;
            font-size: 15px;
        }
        .control-btn:hover, .control-btn:focus-visible { background: rgba(255, 255, 255, .16); }
        .time-label { min-width: 88px; color: rgba(255, 255, 255, .85); font-size: 11px; font-variant-numeric: tabular-nums; }
        .control-spacer { flex: 1; }
        .volume-bar { width: 64px; height: 3px; accent-color: #fff; cursor: pointer; }
        .speed-btn { width: 40px; border: 1px solid rgba(255, 255, 255, .22); border-radius: 5px; font-size: 11px; }
        .quality-select {
            max-width: 90px;
            height: 30px;
            padding: 0 7px;
            border: 1px solid rgba(255, 255, 255, .22);
            border-radius: 5px;
            color: #fff;
            background: #17121d;
            font-size: 11px;
        }
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            clip-path: inset(50%);
        }
        .player-message {
            position: absolute;
            inset: 0;
            z-index: 1;
            display: grid;
            place-content: center;
            gap: 12px;
            padding: 24px;
            color: #eee5f7;
            background: rgba(11, 9, 14, .96);
            text-align: center;
        }
        .player-message[hidden] { display: none; }
        .player-message p { max-width: 540px; margin: 0 auto; color: #c5b8d2; line-height: 1.6; }
        .shortcuts { margin: 3px 0 0; color: #a99bb6; font-size: 12px; line-height: 1.6; }
        .external-link {
            display: inline-flex;
            min-height: 40px;
            align-items: center;
            margin-top: 18px;
            padding: 0 14px;
            border: 1px solid rgba(224, 205, 242, .24);
            border-radius: 10px;
            color: #e8d9f6;
            background: rgba(240, 231, 248, .08);
            text-decoration: none;
        }
        .external-link:hover { background: rgba(174, 145, 209, .2); }
        @media (max-width: 520px) {
            .page { width: min(100% - 24px, 1040px); padding-top: 20px; }
            .player-shell { border-radius: 12px; }
            .player-controls { padding: 30px 8px 8px; }
            .control-row { flex-wrap: wrap; gap: 4px; }
            .control-spacer { display: none; }
            .control-btn { width: 28px; height: 28px; }
            .time-label { min-width: 65px; flex: 1; }
            .volume-bar { width: 44px; }
            .speed-btn { width: 36px; }
            .quality-select { max-width: 70px; padding: 0 3px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; }
        }
    </style>
    <link rel="stylesheet" href="/static/aurora.css?v=4">
</head>
<body>
    <main class="page">
        <a class="back-link" href="/home#study">← Back to YouTube search</a>
        <h1>{{ video_title }}</h1>
        <section class="player-shell" aria-label="Video player">
            <div class="video-frame" id="video-frame">
                <video id="youtube-player" playsinline preload="metadata" tabindex="0"></video>
                <div class="player-message" id="player-message" role="status" aria-live="polite">
                    <p id="message-copy">Loading video stream…</p>
                    <a class="external-link" id="fallback-link" href="https://www.yout-ube.com/watch?v={{ video_id }}" target="_blank" rel="noopener noreferrer" hidden>Open on YouTube</a>
                </div>
                <div class="player-controls" id="player-controls">
                    <input class="progress-bar" id="progress-bar" type="range" min="0" max="1000" value="0" aria-label="Video progress">
                    <div class="control-row">
                        <button class="control-btn" id="play-toggle" type="button" aria-label="Play video">▶</button>
                        <button class="control-btn" id="skip-back" type="button" aria-label="Back 10 seconds" title="Back 10 seconds">↶</button>
                        <button class="control-btn" id="skip-forward" type="button" aria-label="Forward 10 seconds" title="Forward 10 seconds">↷</button>
                        <span class="time-label" id="time-label">0:00 / 0:00</span>
                        <span class="control-spacer"></span>
                        <button class="control-btn" id="mute-toggle" type="button" aria-label="Mute video">🔊</button>
                        <input class="volume-bar" id="volume-bar" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume">
                        <button class="control-btn speed-btn" id="speed-toggle" type="button" aria-label="Playback speed">1x</button>
                        <label class="sr-only" for="quality-select">Video quality</label>
                        <select class="quality-select" id="quality-select" aria-label="Video quality">
                            <option value="360p">360p</option>
                            <option value="480p">480p</option>
                            <option value="720p" selected>720p</option>
                            <option value="1080p">1080p</option>
                            <option value="1440p">1440p</option>
                            <option value="2160p">2160p</option>
                        </select>
                        <button class="control-btn" id="fullscreen-toggle" type="button" aria-label="Fullscreen">⛶</button>
                    </div>
                </div>
            </div>
        </section>
        <p class="shortcuts">Shortcuts (while this page has focus): <strong>Space/K</strong> play or pause · <strong>←/→</strong> seek 10s · <strong>↑/↓</strong> volume · <strong>M</strong> mute · <strong>S</strong> speed · <strong>F</strong> fullscreen.</p>
        <a class="external-link" href="https://www.yout-ube.com/watch?v={{ video_id }}" target="_blank" rel="noopener noreferrer">Open video on YouTube</a>
    </main>
    <script>
        const videoId = {{ video_id | tojson }};
        const playerMessage = document.getElementById("player-message");
        const messageCopy = document.getElementById("message-copy");
        const fallbackLink = document.getElementById("fallback-link");
        const player = document.getElementById("youtube-player");
        const playerFrame = document.getElementById("video-frame");
        const playToggle = document.getElementById("play-toggle");
        const progressBar = document.getElementById("progress-bar");
        const timeLabel = document.getElementById("time-label");
        const volumeBar = document.getElementById("volume-bar");
        const muteToggle = document.getElementById("mute-toggle");
        const speedToggle = document.getElementById("speed-toggle");
        const qualitySelect = document.getElementById("quality-select");
        const playbackSpeeds = [1, 1.25, 1.5, 1.75, 2];
        let currentSpeedIndex = 0;
        let hls;
        let controlsHideTimer;
        let playbackRestoreHandler;

        function showMessage(message, showFallback = false) {
            messageCopy.textContent = message;
            fallbackLink.hidden = !showFallback;
            playerMessage.hidden = false;
        }

        function togglePlayback() {
            if (player.paused) {
                player.play().catch(() => showMessage("The video could not be played. Try opening it on YouTube.", true));
            } else {
                player.pause();
            }
        }

        function seekBy(seconds) {
            if (!Number.isFinite(player.duration)) return;
            player.currentTime = Math.max(0, Math.min(player.duration, player.currentTime + seconds));
        }

        function cycleSpeed() {
            currentSpeedIndex = (currentSpeedIndex + 1) % playbackSpeeds.length;
            player.playbackRate = playbackSpeeds[currentSpeedIndex];
            speedToggle.textContent = `${playbackSpeeds[currentSpeedIndex]}x`;
        }

        function formatTime(seconds) {
            if (!Number.isFinite(seconds) || seconds < 0) return "0:00";
            const value = Math.floor(seconds);
            const hours = Math.floor(value / 3600);
            const minutes = Math.floor((value % 3600) / 60);
            const remainingSeconds = String(value % 60).padStart(2, "0");
            return hours
                ? `${hours}:${String(minutes).padStart(2, "0")}:${remainingSeconds}`
                : `${minutes}:${remainingSeconds}`;
        }

        function updateControls() {
            const duration = Number.isFinite(player.duration) ? player.duration : 0;
            timeLabel.textContent = `${formatTime(player.currentTime)} / ${formatTime(duration)}`;
            progressBar.value = duration ? String(Math.round(player.currentTime / duration * 1000)) : "0";
            playToggle.textContent = player.paused ? "▶" : "Ⅱ";
            playToggle.setAttribute("aria-label", player.paused ? "Play video" : "Pause video");
            muteToggle.textContent = player.muted || player.volume === 0 ? "🔇" : "🔊";
            muteToggle.setAttribute("aria-label", player.muted ? "Unmute video" : "Mute video");
            volumeBar.value = String(player.muted ? 0 : player.volume);
        }

        function revealControls() {
            playerFrame.classList.remove("controls-hidden");
            window.clearTimeout(controlsHideTimer);
            if (!player.paused) {
                controlsHideTimer = window.setTimeout(
                    () => playerFrame.classList.add("controls-hidden"),
                    4000,
                );
            }
        }

        player.addEventListener("playing", () => {
            playerMessage.hidden = true;
            revealControls();
            updateControls();
        });
        player.addEventListener("pause", () => {
            playerFrame.classList.remove("controls-hidden");
            window.clearTimeout(controlsHideTimer);
            updateControls();
        });
        ["loadedmetadata", "durationchange", "timeupdate", "volumechange", "ratechange"].forEach((eventName) => {
            player.addEventListener(eventName, updateControls);
        });
        player.addEventListener("ended", () => {
            playerFrame.classList.remove("controls-hidden");
            updateControls();
        });
        player.addEventListener("error", () => {
            showMessage("The video stream could not be loaded. You can still open it directly on YouTube.", true);
        });

        function getStreamUrl() {
            const params = new URLSearchParams({ quality: qualitySelect.value });
            return `/api/youtube/stream/${encodeURIComponent(videoId)}.m3u8?${params}`;
        }

        function getMp4Url() {
            const params = new URLSearchParams({ quality: qualitySelect.value });
            return `/api/youtube/file/${encodeURIComponent(videoId)}?${params}`;
        }

        function getSourceInfoUrl() {
            const params = new URLSearchParams({ quality: qualitySelect.value });
            return `/api/youtube/source/${encodeURIComponent(videoId)}?${params}`;
        }

        function restorePlayback(resumeTime, resumePlayback) {
            if (resumeTime > 0 && Number.isFinite(player.duration)) {
                player.currentTime = Math.min(resumeTime, player.duration);
            }
            if (resumePlayback) {
                player.play().catch(() => showMessage("The video could not be played. Try opening it on YouTube.", true));
            } else {
                playerMessage.hidden = true;
            }
        }

        function restorePlaybackOnMetadata(resumeTime, resumePlayback) {
            if (playbackRestoreHandler) {
                player.removeEventListener("loadedmetadata", playbackRestoreHandler);
            }
            playbackRestoreHandler = () => {
                playbackRestoreHandler = null;
                restorePlayback(resumeTime, resumePlayback);
            };
            player.addEventListener("loadedmetadata", playbackRestoreHandler, { once: true });
        }

        playToggle.addEventListener("click", togglePlayback);
        player.addEventListener("click", togglePlayback);
        document.getElementById("skip-back").addEventListener("click", () => seekBy(-10));
        document.getElementById("skip-forward").addEventListener("click", () => seekBy(10));
        progressBar.addEventListener("input", () => {
            if (Number.isFinite(player.duration)) {
                player.currentTime = Number(progressBar.value) / 1000 * player.duration;
            }
        });
        volumeBar.addEventListener("input", () => {
            player.volume = Number(volumeBar.value);
            player.muted = player.volume === 0;
        });
        muteToggle.addEventListener("click", () => { player.muted = !player.muted; });
        speedToggle.addEventListener("click", cycleSpeed);
        document.getElementById("fullscreen-toggle").addEventListener("click", () => {
            if (document.fullscreenElement) void document.exitFullscreen();
            else if (playerFrame.requestFullscreen) void playerFrame.requestFullscreen();
        });
        ["mousemove", "touchstart"].forEach((eventName) => {
            playerFrame.addEventListener(eventName, revealControls, { passive: true });
        });
        playerFrame.addEventListener("focusin", revealControls);
        playerFrame.addEventListener("mouseleave", () => {
            if (!player.paused) playerFrame.classList.add("controls-hidden");
        });

        function startHlsPlayback(resumeTime, resumePlayback) {
            if (!player.canPlayType("application/vnd.apple.mpegurl")) {
                showMessage("HLS playback is unavailable in this browser. You can still open the video on YouTube.", true);
                return;
            }
            restorePlaybackOnMetadata(resumeTime, resumePlayback);
            player.src = getStreamUrl();
            player.load();
        }

        let playbackRequestId = 0;
        let sourceRequestController;

        async function startPlayback(resumeTime = 0, resumePlayback = false) {
            const requestId = ++playbackRequestId;
            sourceRequestController?.abort();
            sourceRequestController = new AbortController();
            if (hls) {
                hls.destroy();
                hls = null;
            }
            if (playbackRestoreHandler) {
                player.removeEventListener("loadedmetadata", playbackRestoreHandler);
                playbackRestoreHandler = null;
            }
            player.pause();
            player.removeAttribute("src");
            player.load();
            try {
                const response = await fetch(getSourceInfoUrl(), { signal: sourceRequestController.signal });
                const source = await response.json();
                if (!response.ok) throw new Error(source.detail || "The video stream is temporarily unavailable.");
                if (requestId !== playbackRequestId) return;

                if (source.format === "mp4") {
                    restorePlaybackOnMetadata(resumeTime, resumePlayback);
                    player.src = getMp4Url();
                    player.load();
                    return;
                }

                if (source.format !== "hls") {
                    throw new Error("The video stream format is not supported.");
                }
                if (window.Hls && Hls.isSupported()) {
                    hls = new Hls();
                    restorePlaybackOnMetadata(resumeTime, resumePlayback);
                    hls.loadSource(getStreamUrl());
                    hls.attachMedia(player);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        if (!resumeTime && !resumePlayback) playerMessage.hidden = true;
                    });
                    hls.on(Hls.Events.ERROR, (_event, data) => {
                        if (data.fatal) {
                            hls.destroy();
                            hls = null;
                            showMessage("The video stream could not be loaded. You can still open it directly on YouTube.", true);
                        }
                    });
                } else if (player.canPlayType("application/vnd.apple.mpegurl")) {
                    startHlsPlayback(resumeTime, resumePlayback);
                } else {
                    showMessage("This browser does not support HLS video playback. Try a browser with HLS support or open the video on YouTube.", true);
                }
            } catch (error) {
                if (error.name === "AbortError" || requestId !== playbackRequestId) return;
                showMessage(error.message || "The video stream could not be loaded.", true);
            }
        }

        qualitySelect.addEventListener("change", () => {
            const resumeTime = Number.isFinite(player.currentTime) ? player.currentTime : 0;
            const resumePlayback = !player.paused && !player.ended;
            showMessage(`Loading ${qualitySelect.value} stream…`);
            startPlayback(resumeTime, resumePlayback);
        });

        document.addEventListener("keydown", (event) => {
            const target = event.target;
            if (target instanceof HTMLInputElement || target instanceof HTMLTextAreaElement
                || target instanceof HTMLSelectElement || target.isContentEditable) return;
            if (event.key === " " && target instanceof Element && target.closest("button, a")) return;
            if (event.ctrlKey || event.metaKey || event.altKey) return;
            const key = event.key.toLowerCase();
            if (![" ", "k", "arrowleft", "arrowright", "arrowup", "arrowdown", "m", "s", "f"].includes(key)) return;
            if (event.repeat) return;
            event.preventDefault();
            if (key === " " || key === "k") togglePlayback();
            else if (key === "arrowleft") seekBy(-10);
            else if (key === "arrowright") seekBy(10);
            else if (key === "arrowup") player.volume = Math.min(1, player.volume + 0.05);
            else if (key === "arrowdown") player.volume = Math.max(0, player.volume - 0.05);
            else if (key === "m") {
                player.muted = !player.muted;
            } else if (key === "s") cycleSpeed();
            else if (key === "f") {
                const frame = document.querySelector(".video-frame");
                if (document.fullscreenElement) void document.exitFullscreen();
                else if (frame.requestFullscreen) void frame.requestFullscreen();
            }
        });

        const hlsScript = document.createElement("script");
        hlsScript.src = "https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js";
        hlsScript.onload = startPlayback;
        hlsScript.onerror = startPlayback;
        document.head.append(hlsScript);
    </script>
    <script src="/static/aurora.js?v=2" defer></script>
</body>
</html>
