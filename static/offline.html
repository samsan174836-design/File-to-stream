<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#198754">
    <title>You're offline · Karva Bhaiya</title>
    <style>
        :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #17251e; background: #f7faf8; }
        body { display: grid; min-height: 100vh; margin: 0; place-items: center; }
        main { max-width: 420px; padding: 32px; text-align: center; }
        h1 { color: #124c36; font-size: 28px; }
        p { color: #68776f; line-height: 1.6; }
        button { margin-top: 12px; padding: 12px 18px; border: 0; border-radius: 10px; color: white; background: #198754; font: inherit; font-weight: 700; }
    </style>
</head>
<body>
    <main>
        <h1>You're offline</h1>
        <p>Connect to the internet to open your library and stream files. Your library and media remain on the secure server.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </main>
</body>
</html>
